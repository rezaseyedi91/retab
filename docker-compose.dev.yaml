services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3306:3306"

    expose:
      - "3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  create-user:
    image: mysql:8.4

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        until mysqladmin ping \
          -h mysql \
          -P 3306 \
          -u root \
          -p"$${MYSQL_ROOT_PASSWORD}" \
          --protocol=tcp \
          --silent
        do
          echo "Waiting for MySQL..."
          sleep 2
        done

        mysql \
          -h mysql \
          -P 3306 \
          -u root \
          -p"$${MYSQL_ROOT_PASSWORD}" \
          --protocol=tcp \
          -e "
            CREATE DATABASE IF NOT EXISTS \`$${MYSQL_DATABASE}\`;
            CREATE USER IF NOT EXISTS '$${MYSQL_USER}'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';
            ALTER USER '$${MYSQL_USER}'@'%' IDENTIFIED BY '$${MYSQL_PASSWORD}';
            GRANT ALL PRIVILEGES ON \`$${MYSQL_DATABASE}\`.* TO '$${MYSQL_USER}'@'%';
            FLUSH PRIVILEGES;
          "
  migrate:
    build:
      context: ./retab-server

    env_file:
      - .env

    depends_on:
      create-user:
        condition: service_completed_successfully
    command: npx prisma migrate deploy

  init-data:
    image: mysql:8.4

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    command:
      - sh
      - -c
      - |
        set -e
        echo "Importing ReTab initial data..."
        echo "SQL file size:"
        wc -c /retab-initial-data.sql

        mysql \
          -h mysql \
          -u "$$MYSQL_USER" \
          -p"$$MYSQL_PASSWORD" \
          "$$MYSQL_DATABASE" \
            < /retab-initial-data.sql

          echo "Initial data imported successfully."
    volumes:
      - ./initial-db/retab-initial-data.sql:/retab-initial-data.sql:ro

  server:
    build:
      context: ./retab-server
    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - .env

    depends_on:
      init-data:
        condition: service_completed_successfully

  client:
    build:
      context: ./retab-client

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - ./retab-client/.env

    depends_on:
      server:
        condition: service_started

volumes:
  mysql_data:
