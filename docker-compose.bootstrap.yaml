services:

  init-data:
    image: mysql:8.4

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    command:
      - sh
      - -c
      - |
        set -e

        echo "Importing ReTab initial data..."

        mysql \
          -h mysql \
          -u "$$MYSQL_USER" \
          -p"$$MYSQL_PASSWORD" \
          "$$MYSQL_DATABASE" \
          < /retab-initial-data.sql

        echo "Initial data imported successfully."

    volumes:
      - ./initial-db/retab-initial-data.sql:/retab-initial-data.sql:ro