services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./retab-server

    env_file:
      - .env

    depends_on:
      create-user:
        condition: service_completed_successfully
    command: npx prisma migrate deploy
  create-user:
  init-data:
    image: mysql:8.4

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    command:
      - sh
      - -c
      - |
        set -e
        echo "Importing ReTab initial data..."
        echo "SQL file size:"
        wc -c /retab-initial-data.sql

        mysql \
          -h mysql \
          -u "$$MYSQL_USER" \
          -p"$$MYSQL_PASSWORD" \
          "$$MYSQL_DATABASE" \
            < /retab-initial-data.sql

          echo "Initial data imported successfully."
    volumes:
      - ./initial-db/retab-initial-data.sql:/retab-initial-data.sql:ro

  server:
    build:
      context: ./retab-server
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "4000"
    ports:
      - "${RETAB_SERVER_PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy


  client:
    build:
      context: ./retab-client
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    ports:
    - "${RETAB_CLIENT_PORT:-8080}:80"
    depends_on:
      - server


volumes:
  mysql_data: