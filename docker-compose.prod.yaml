services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20

  create-user:
    image: mysql:8.4
    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        mysql \
          -h mysql \
          -u root \
          -p"$${MYSQL_ROOT_PASSWORD}" \
          -e "
          CREATE DATABASE IF NOT EXISTS $${MYSQL_DATABASE};
          CREATE USER IF NOT EXISTS '$${MYSQL_USER}'@'%'
          IDENTIFIED BY '$${MYSQL_PASSWORD}';
          GRANT ALL PRIVILEGES ON $${MYSQL_DATABASE}.*
          TO '$${MYSQL_USER}'@'%';
          FLUSH PRIVILEGES;
          "

  migrate:
    build:
      context: ./retab-server

    env_file:
      - .env

    depends_on:
      create-user:
        condition: service_completed_successfully

    command: npx prisma migrate deploy

  server:
    build:
      context: ./retab-server

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ./retab-client

    restart: unless-stopped

    env_file:
      - ./retab-client/.env

    depends_on:
      server:
        condition: service_started
volumes:
  mysql_data:
