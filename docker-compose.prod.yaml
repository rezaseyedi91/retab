services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20

  create-user:
    image: mysql:8.4
    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        mysql \
          -h mysql \
          -u root \
          -p"$${MYSQL_ROOT_PASSWORD}" \
          -e "
          CREATE DATABASE IF NOT EXISTS $${MYSQL_DATABASE};
          CREATE USER IF NOT EXISTS '$${MYSQL_USER}'@'%'
          IDENTIFIED BY '$${MYSQL_PASSWORD}';
          GRANT ALL PRIVILEGES ON $${MYSQL_DATABASE}.*
          TO '$${MYSQL_USER}'@'%';
          FLUSH PRIVILEGES;
          "

  migrate:
    build:
      context: ./retab-server

    env_file:
      - .env

    depends_on:
      create-user:
        condition: service_completed_successfully

    command: npx prisma migrate deploy

  server:
    build:
      context: ./retab-server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "4000"
    ports:
      - "${RETAB_SERVER_PORT:-4000}:4000"
    env_file:
      - .env

    depends_on:
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: ./retab-client
      dockerfile: Dockerfile.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.retab.rule=Host(`musica.huma-num.fr`) && PathPrefix(`/retab`)"
      - "traefik.http.routers.retab.entrypoints=websecure"
      - "traefik.http.middlewares.retab-strip.stripprefix.prefixes=/retab"
      - "traefik.http.routers.retab.middlewares=retab-strip"
      - "traefik.http.services.retab.loadbalancer.server.port=80"
      - "traefik.http.routers.retab.tls.certresolver=prod"
    restart: unless-stopped

    env_file:
      - ./retab-client/.env
    ports:
      - "${RETAB_CLIENT_PORT:-8080}:80"
    networks:
      - default
      - portail-musica_default
    depends_on:
      server:
        condition: service_started


networks:
  portail-musica_default:
    external: true
volumes:
  mysql_data:
