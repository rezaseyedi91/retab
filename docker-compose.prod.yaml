services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  server:
    build:
      context: ./retab-server
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "4000"
    ports:
      - "${RETAB_SERVER_PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy


  client:
    build:
      context: ./retab-client
      dockerfile: Dockerfile.prod

    restart: unless-stopped

    ports:
    - "${RETAB_CLIENT_PORT:-8080}:80"
    depends_on:
      - server


volumes:
  mysql_data: